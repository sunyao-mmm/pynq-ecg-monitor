<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PYNQ-Z2 心电实时监测</title>
<style>
  :root{--bg:#0d1117;--panel:#161b22;--line:#30363d;--text:#e6edf3;--muted:#8b949e;--blue:#58a6ff;--green:#3fb950;--red:#f85149;--orange:#f0883e}
  *{box-sizing:border-box} html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:"Segoe UI","Microsoft YaHei",Arial,sans-serif}
  .wrap{max-width:1280px;margin:0 auto;padding:18px}.top{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
  h1{font-size:23px;margin:0}.status{font-size:14px;color:var(--muted)}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--red);margin-right:7px}.dot.on{background:var(--green)}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.toolbar button{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:9px 16px;border-radius:7px;cursor:pointer}.toolbar button.active{border-color:var(--blue);background:#17283d;color:#d8ecff}.toolbar button.danger{border-color:#6e2a2a;color:#ffb4ad}.toolbar button:disabled{opacity:.45;cursor:default}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:12px}.card{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:10px 14px}.k{font-size:12px;color:var(--muted)}.v{font-size:26px;font-weight:700;margin-top:3px}.v.bpm{color:var(--orange)}.v.ok{color:var(--green)}.v.bad{color:var(--red)}.v.pvc{color:var(--red)}.v.pac{color:var(--orange)}
  .plot{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:6px;margin-bottom:12px}canvas{display:block;width:100%;height:270px}.plot.clt canvas{height:190px}.caption{color:var(--muted);font-size:12px;padding:0 8px 5px}.hint{color:var(--muted);font-size:12px;line-height:1.7;margin-top:8px}
  @media(max-width:850px){.cards{grid-template-columns:repeat(2,1fr)}h1{font-size:19px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>PYNQ-Z2 心电实时监测</h1>
    <div class="status"><span id="dot" class="dot"></span><span id="status">连接中</span></div>
  </div>
  <div class="toolbar">
    <button id="src0" onclick="setSource(0)">ROM 数据</button>
    <button id="src1" onclick="setSource(1)">实时 ADS1292</button>
    <button id="toggle" class="danger" onclick="toggleRun()">停止</button>
  </div>
  <div class="cards">
    <div class="card"><div class="k">BPM</div><div id="bpm" class="v bpm">--</div></div>
    <div class="card"><div class="k">RR 中位</div><div id="rr" class="v">--</div></div>
    <div class="card"><div class="k">累计心搏</div><div id="beats" class="v">--</div></div>
    <div class="card" id="pvcCard"><div class="k">窗口室早</div><div id="pvc" class="v pvc">--</div></div>
    <div class="card"><div class="k">信号质量</div><div id="quality" class="v bad">等待</div></div>
    <div class="card"><div class="k">显示 / 分析</div><div id="window" class="v">--</div></div>
  </div>
  <div class="plot"><canvas id="wave"></canvas><div id="waveCaption" class="caption">实时 ECG：红色倒三角为 R 峰</div></div>
  <div class="plot clt"><canvas id="clt"></canvas><div class="caption">CLT 曲线</div></div>
  <div id="windowHint" class="hint">显示和分析窗口按启动参数配置。切换数据源会重新初始化检测器。</div>
</div>
<script>
let running=true, source=0, busy=false;
const state={wave:[],clt:[],normal:[],pvc:[],r:[]};
let lastRunning=true,lastSource=0,lastSamples=0,lastAnalysis=0,lastWindow=0,lastAnalysisWindow=0,lastBpm=0,lastRr=0,lastBeats=0,lastPvc=0,lastRecovered=0,lastSignalValid=false,lastQuality=false,lastRhythm="样本不足",lastSourceName="MIT-BIH ROM";
const $=id=>document.getElementById(id);
function fit(canvas){const d=devicePixelRatio||1;const w=canvas.clientWidth,h=canvas.clientHeight;if(canvas.width!==Math.round(w*d)||canvas.height!==Math.round(h*d)){canvas.width=Math.round(w*d);canvas.height=Math.round(h*d);}const g=canvas.getContext("2d");g.setTransform(d,0,0,d,0,0);return [g,w,h];}
function drawMarkers(g,data,peaks,color,x,y){
  if(!peaks||!peaks.length)return;
  g.fillStyle=color;
  for(const i of peaks){
    if(i<0||i>=data.length)continue;
    const px=x(i),py=y(data[i]);
    g.beginPath();g.moveTo(px,py-12);g.lineTo(px-6,py-22);g.lineTo(px+6,py-22);g.closePath();g.fill();
  }
}
function percentile(values,p){const sorted=[...values].sort((a,b)=>a-b);return sorted[Math.min(sorted.length-1,Math.max(0,Math.floor(p*(sorted.length-1))))];}
function drawSeries(canvas,data,color,markers={},scaleMode="symmetric"){
  const [g,w,h]=fit(canvas);g.clearRect(0,0,w,h);g.strokeStyle="#30363d";g.lineWidth=1;
  for(let i=1;i<5;i++){const y=h*i/5;g.beginPath();g.moveTo(0,y);g.lineTo(w,y);g.stroke();}
  for(let i=1;i<8;i++){const x=w*i/8;g.beginPath();g.moveTo(x,0);g.lineTo(x,h);g.stroke();}
  if(!data||data.length<2)return;
  let min,max;
  if(scaleMode==="positive"){
    min=0;max=Math.max(500,1.8*percentile(data.map(v=>Math.max(0,v)),0.99));
  }else{
    const half=Math.max(40,1.5*percentile(data.map(v=>Math.abs(v)),0.99));
    min=-half;max=half;
  }
  const x=i=>i*(w/(data.length-1));const y=v=>h-(v-min)/(max-min)*h;
  g.strokeStyle=color;g.lineWidth=1.6;g.beginPath();data.forEach((v,i)=>{i?g.lineTo(x(i),y(v)):g.moveTo(x(i),y(v));});g.stroke();
  drawMarkers(g,data,markers.normal,"#3fb950",x,y);
  drawMarkers(g,data,markers.pvc,"#f85149",x,y);
  drawMarkers(g,data,markers.r,"#f85149",x,y);
}
function render(d){
  state.wave=d.frame||[];state.clt=d.clt||[];
  state.normal=d.normal_peaks||d.peaks||[];state.pvc=d.pvc_peaks||[];state.r=d.r_peaks||[];
  lastRunning=!!d.running;lastSource=d.source||0;lastSamples=d.samples||0;lastAnalysis=d.analysis_samples||lastSamples;lastWindow=d.window||lastSamples;lastAnalysisWindow=d.analysis_window||lastAnalysis;lastBpm=d.bpm||0;lastRr=d.rr||0;lastBeats=d.beat_count||0;lastPvc=d.pvc_count||0;lastRecovered=d.recovered_count||0;lastSignalValid=!!(d.signal_valid??d.quality);lastQuality=!!d.quality;lastRhythm=d.rhythm_status||"样本不足";lastSourceName=d.source_name||lastSourceName;
  $("bpm").textContent=lastSignalValid&&d.bpm?d.bpm:"--";$("rr").textContent=lastSignalValid&&d.rr?d.rr:"--";$("beats").textContent=lastSignalValid?(d.beat_count??"--"):"--";$("pvc").textContent=lastSignalValid?(d.pvc_count??"--"):"--";
  $("quality").textContent=d.quality?"通过":"异常";$("quality").className="v "+(d.quality?"ok":"bad");$("quality").title=d.quality_text||"";
  $("window").textContent=(d.samples||0)+" / "+(d.analysis_samples||0);$("dot").className="dot "+(d.running?"on":"");
  $("status").textContent=d.running
    ?(d.source===0?d.source_name+" · PS离线复核"
      :(lastSignalValid?d.source_name+" · 节律："+lastRhythm+" · 室早复核":d.source_name+" · 信号异常"))
    :"已停止";
  $("windowHint").textContent="显示最近 "+lastWindow+" 点；分析窗口 "+lastAnalysisWindow+" 点。切换数据源会重新初始化检测器。";
  $("src0").classList.toggle("active",d.source===0);$("src1").classList.toggle("active",d.source===1);
  $("toggle").textContent=d.running?"停止":"开始";running=d.running;
  $("waveCaption").textContent=d.source===0
    ?"ROM ECG + PS 复核：绿=正常，红=室早"
    :"实时 ECG + PS 复核：绿=正常，红=室早";
  drawSeries($("wave"),state.wave,"#58a6ff",{normal:state.normal,pvc:state.pvc,r:state.r},"symmetric");
  drawSeries($("clt"),state.clt,"#3fb950",{},"positive");
}
async function poll(){try{const r=await fetch("/api/state",{cache:"no-store"});if(r.ok)render(await r.json());}catch(e){}}
async function post(path){if(busy)return;busy=true;try{const r=await fetch(path,{method:"POST"});if(r.ok)render(await r.json());}catch(e){}busy=false;}
function setSource(v){post("/api/source/"+v)}
function toggleRun(){post(running?"/api/stop":"/api/start")}
addEventListener("resize",()=>render({frame:state.wave,clt:state.clt,normal_peaks:state.normal,pvc_peaks:state.pvc,r_peaks:state.r,running:lastRunning,source:lastSource,samples:lastSamples,analysis_samples:lastAnalysis,window:lastWindow,analysis_window:lastAnalysisWindow,bpm:lastBpm,rr:lastRr,beat_count:lastBeats,pvc_count:lastPvc,recovered_count:lastRecovered,signal_valid:lastSignalValid,quality:lastQuality,quality_text:"",rhythm_status:lastRhythm,source_name:lastSourceName}));
setInterval(poll,80);poll();
</script>
</body>
</html>
